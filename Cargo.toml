[package]
name = "playbill"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Release-name parser for movies, TV, anime, ebooks and audiobooks"
repository = "https://github.com/Krifmaz/playbill"
keywords = ["parser", "release", "media", "torrent", "usenet"]
categories = ["parser-implementations", "multimedia"]

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
