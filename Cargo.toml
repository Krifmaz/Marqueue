[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Krifmaz/Marqueue"

[workspace.dependencies]
playbill = { git = "https://github.com/Krifmaz/playbill", features = ["serde"] }
marqueue-core = { path = "crates/marqueue-core" }
marqueue-metadata = { path = "crates/marqueue-metadata" }
marqueue-adapters = { path = "crates/marqueue-adapters" }
scoutline = { path = "crates/scoutline" }
scoutline-core = { git = "https://github.com/Krifmaz/Scoutline" }
scoutline-defs = { git = "https://github.com/Krifmaz/Scoutline" }
scoutline-net = { git = "https://github.com/Krifmaz/Scoutline" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
tracing = "0.1"
toml = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
