[package]
name = "scoutline-core"
description = "Scoutline search engine: indexers, fan-out search, cache and health"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures = "0.3.34"
playbill = { path = "../playbill", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false }
roxmltree = "0.21.1"
scoutline-net = { path = "../scoutline-net" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time", "sync", "macros", "rt"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
