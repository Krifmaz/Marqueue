# Test definition (written for Scoutline's tests, not an upstream file).
id: example-html
name: Example HTML Tracker
description: A private tracker with a form login
language: en-US
type: private
encoding: UTF-8
links:
  - http://placeholder.invalid/

caps:
  categorymappings:
    - {id: 1, cat: Movies/HD, desc: "Movies HD"}
    - {id: 2, cat: TV/HD, desc: "TV HD"}
    - {id: 3, cat: TV/Anime, desc: "Anime"}
    - {id: 9, cat: Audio/Lossless, desc: "FLAC"}
  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q, imdbid]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: sort
    type: select
    label: Sort
    default: added
    options:
      added: created
      seeders: seeders
  - name: freeleech
    type: checkbox
    label: Freeleech only
    default: false

login:
  path: login.php
  method: form
  form: form#login
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
  selectorinputs:
    csrf:
      selector: "input[name=csrf]"
      attribute: value
  error:
    - selector: div.login-error
  test:
    path: index.php
    selector: a[href*="logout"]

search:
  paths:
    - path: browse.php
  inputs:
    search: "{{ .Keywords }}"
    sort: "{{ .Config.sort }}"
    $raw: "{{ range .Categories }}c{{ . }}=1&{{ end }}{{ if .Config.freeleech }}fl=1{{ end }}"
  keywordsfilters:
    - name: re_replace
      args: ["\\.", " "]
  rows:
    selector: table#torrents > tbody > tr:has(a.title)
  fields:
    category:
      selector: a[href*="?cat="]
      attribute: href
      filters:
        - name: querystring
          args: cat
    title:
      selector: a.title
    details:
      selector: a.title
      attribute: href
    download:
      selector: a[href^="download.php"]
      attribute: href
    size:
      selector: td:nth-child(4)
    seeders:
      selector: td.seeders
    leechers:
      selector: td.leechers
    grabs:
      selector: td:contains("snatched")
      filters:
        - name: regexp
          args: "(\\d+)"
    date:
      selector: td.added
      filters:
        - name: timeago
    downloadvolumefactor:
      case:
        img[alt="Freeleech"]: 0
        "*": 1
    uploadvolumefactor:
      text: 1
    imdbid:
      selector: a[href*="imdb.com/title/"]
      attribute: href
      optional: true
