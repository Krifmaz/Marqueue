# Test definition (written for Scoutline's tests, not an upstream file).
id: example-json
name: Example JSON Site
type: public
links:
  - http://placeholder.invalid/
caps:
  categories:
    movies: Movies
    music: Audio/Lossless
  modes:
    search: [q]
    music-search: [q, artist, album]
settings:
  - name: apikey
    type: text
    label: API key
search:
  paths:
    - path: api/search
      response:
        type: json
        noResultsMessage: "[]"
  headers:
    X-Api-Key: "{{ .Config.apikey }}"
  inputs:
    q: "{{ if .Query.Artist }}{{ .Query.Artist }} {{ .Query.Album }}{{ else }}{{ .Keywords }}{{ end }}"
  rows:
    selector: $.data.groups
    attribute: torrents
  fields:
    artist:
      selector: ..artist
    album:
      selector: ..album
    year:
      selector: ..year
    format:
      selector: format
    title:
      text: "{{ .Result.artist }} - {{ .Result.album }} ({{ .Result.year }}) [{{ .Result.format }}]"
    category:
      selector: ..category
    details:
      selector: id
      filters:
        - name: prepend
          args: "torrents/"
    download:
      selector: magnet
    size:
      selector: bytes
    seeders:
      selector: stats.seeders
    leechers:
      selector: stats.leechers
    date:
      selector: added
    downloadvolumefactor:
      selector: free
      case:
        "True": 0
        "False": 1
