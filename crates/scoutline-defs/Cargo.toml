[package]
name = "scoutline-defs"
description = "Scoutline definition engine: Cardigann-style YAML indexer definitions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
encoding_rs = "0.8.35"
fancy-regex = "0.19.2"
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "form"] }
scoutline-core = { path = "../scoutline-core" }
scoutline-net = { path = "../scoutline-net" }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.1.0"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time"] }
tracing = "0.1.44"
unicode-normalization = "0.1.25"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
