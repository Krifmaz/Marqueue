<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoutline</title>
<style>
:root {
  --bg: #f7f7f8; --panel: #fff; --text: #1b1c1f; --muted: #6b6f78; --line: #e3e4e8;
  --accent: #2f6fde; --ok: #1f8a4c; --bad: #c63b3b; --warn: #b7791f;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141518; --panel: #1c1d21; --text: #e8e9ec; --muted: #9a9ea8; --line: #2c2e34;
    --accent: #6c9cf0; --ok: #4cc283; --bad: #ef6b6b; --warn: #e0a64a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0 8px 0 0; }
main { padding: 16px; max-width: 1400px; margin: 0 auto; }
form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
input, select, button { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--text); }
input[name=q] { flex: 1 1 260px; }
input.small { width: 90px; }
button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
#key { width: 260px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.title { white-space: normal; min-width: 320px; word-break: break-word; }
tr:last-child td { border-bottom: 0; }
.tag { display: inline-block; padding: 0 6px; margin: 2px 4px 0 0; border-radius: 4px; font-size: 12px;
  background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); }
.muted { color: var(--muted); }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
#status { margin: 0 0 12px; min-height: 1.4em; }
#indexers { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>Scoutline</h1>
  <input id="key" type="password" placeholder="API key (from scoutline.toml)" autocomplete="off">
</header>
<main>
  <div id="indexers"></div>
  <form id="search">
    <select name="t">
      <option value="search">All</option>
      <option value="tvsearch">TV</option>
      <option value="movie">Movie</option>
      <option value="book">Book</option>
    </select>
    <input name="q" placeholder="Search, or leave empty for latest" autofocus>
    <input name="season" class="small" placeholder="Season">
    <input name="ep" class="small" placeholder="Episode">
    <input name="imdbid" class="small" placeholder="IMDb id">
    <button>Search</button>
  </form>
  <p id="status" class="muted"></p>
  <div class="panel"><table>
    <thead><tr><th>Release</th><th>Parsed</th><th>Size</th><th>Age</th><th>Seeds</th><th>Indexers</th><th></th></tr></thead>
    <tbody id="results"><tr><td colspan="7" class="muted">No search yet.</td></tr></tbody>
  </table></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const keyInput = $("#key");
try { keyInput.value = localStorage.getItem("scoutline-key") || ""; } catch {}
keyInput.addEventListener("change", () => {
  try { localStorage.setItem("scoutline-key", keyInput.value); } catch {}
  loadIndexers();
});

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const size = (b) => { if (!b) return ""; const u = ["B","KB","MB","GB","TB"]; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return b.toFixed(i > 2 ? 2 : 0) + " " + u[i]; };
const age = (d) => { if (!d) return ""; const h = (Date.now() - new Date(d)) / 36e5; return h < 1 ? Math.max(1, Math.round(h * 60)) + "m" : h < 48 ? Math.round(h) + "h" : Math.round(h / 24) + "d"; };

async function api(path, params = {}) {
  const qs = new URLSearchParams({ ...params, apikey: keyInput.value });
  const r = await fetch(path + "?" + qs);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

async function loadIndexers() {
  if (!keyInput.value) { $("#indexers").innerHTML = '<span class="muted">Enter the API key to start.</span>'; return; }
  try {
    const list = await api("/api/v1/indexers");
    $("#indexers").innerHTML = list.length ? list.map((i) => {
      const h = i.health;
      const cls = !i.enabled ? "muted" : !h ? "" : h.backoff_until ? "bad" : h.consecutive_failures ? "warn" : "ok";
      const why = h && h.history.length ? h.history[h.history.length - 1].reason : "";
      return `<span class="chip" title="${esc(why)}"><span class="${cls}">●</span> ${esc(i.name)} <span class="muted">${i.protocol}</span></span>`;
    }).join("") : '<span class="muted">No indexers yet: add [[indexer]] blocks to scoutline.toml and restart.</span>';
  } catch (e) { $("#indexers").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}

function parsed(r) {
  const p = r.release, tags = [];
  if (p.seasons.length) tags.push("S" + p.seasons.join(",") + (p.episodes.length ? " E" + p.episodes.join(",") : ""));
  if (p.absolute_episodes.length) tags.push("#" + p.absolute_episodes.join(","));
  if (p.year) tags.push(p.year);
  for (const v of [p.resolution, p.source, p.codec, ...p.hdr, p.audio, p.release_group]) if (v) tags.push(v);
  if (r.origins.some((o) => o.download_factor === 0)) tags.push("freeleech");
  return `<div>${esc(p.title || "")}</div>` + tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("");
}

$("#search").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const params = Object.fromEntries([...new FormData(ev.target)].filter(([, v]) => v));
  $("#status").textContent = "Searching…";
  const started = performance.now();
  try {
    const out = await api("/api/v1/search", params);
    const secs = ((performance.now() - started) / 1000).toFixed(1);
    const errs = out.errors.map((e) => `${e.indexer}: ${e.error}`).join(" · ");
    $("#status").innerHTML = `${out.results.length} results in ${secs}s` + (errs ? ` · <span class="bad">${esc(errs)}</span>` : "");
    $("#results").innerHTML = out.results.map((r) => {
      const best = r.origins[0];
      return `<tr>
        <td class="title">${esc(r.title)}</td>
        <td>${parsed(r)}</td>
        <td>${size(r.size)}</td>
        <td>${age(r.published)}</td>
        <td>${r.protocol === "torznab" ? (r.origins.reduce((n, o) => n + (o.seeders || 0), 0)) : ""}</td>
        <td>${r.origins.map((o) => esc(o.indexer_name)).join("<br>")}</td>
        <td>${best.download_url ? `<a href="${esc(best.download_url)}" rel="noreferrer">Get</a>` : ""}</td>
      </tr>`;
    }).join("") || '<tr><td colspan="7" class="muted">Nothing found.</td></tr>';
  } catch (e) {
    $("#status").innerHTML = `<span class="bad">${esc(e.message)}</span>`;
  }
  loadIndexers();
});

loadIndexers();
</script>
</body>
</html>
