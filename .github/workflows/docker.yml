name: Docker

# Builds the multi-arch images and pushes them to GHCR:
#   ghcr.io/krifmaz/marqueue  (Dockerfile)
#   ghcr.io/krifmaz/scoutline (Dockerfile.scoutline, standalone indexer server)
# main -> :latest, other branches -> :<branch>, tags v* -> :<version>.
# Each architecture builds on a native runner (QEMU took 25+ minutes);
# the merge job joins them into one multi-arch tag.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        image: [marqueue, scoutline]
        arch:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch.runner }}
    env:
      IMAGE: ghcr.io/krifmaz/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image == 'scoutline' && 'Dockerfile.scoutline' || 'Dockerfile' }}
          platforms: ${{ matrix.arch.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "ARCH=${{ matrix.arch.platform }}" | tr / - >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ env.ARCH }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    strategy:
      matrix:
        image: [marqueue, scoutline]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/krifmaz/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - name: Create multi-arch tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
